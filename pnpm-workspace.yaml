packages:
  - 'packages/*'
  - 'teammapper-backend'
  - 'teammapper-frontend'
# 7-day quarantine on newly published versions (mitigates fast-revoked malicious releases).
minimumReleaseAge: 10080
# Exact versions exempt from the quarantine. Each entry fixes a critical
# advisory whose patched release is younger than seven days. Remove an entry
# once its version has aged out.
minimumReleaseAgeExclude:
  # GHSA-67c8-pqhq-4rmx (critical, RCE). See the piscina override below.
  - 'piscina@5.3.2'
# Refuse to install under a Node version that a workspace's engines.node rejects.
engineStrict: true
strictDepBuilds: true
allowBuilds:
  '@compodoc/compodoc': false
  '@nestjs/core': false
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
# Transitive-dep CVE pins. Audit periodically with `pnpm why <pkg>` and remove
# entries whose selector no longer matches any node in pnpm-lock.yaml.
overrides:
  # GHSA-72gw-mp4g-v24j (DoS) and the advisories fixed in 2.3.0. Held back by
  # @nestjs/platform-express.
  'multer@<2.3.0': '>=2.3.0 <3.0.0'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '8.18.0'
  'underscore@<=1.13.7': '1.13.8'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4 <5.0.0'
  'lodash@<4.18.0': '>=4.18.0'
  # GHSA-q3jh-wrc6-jgq8 / -8r9p-f939-6h3c. Parent: http-proxy-middleware > http-proxy.
  'follow-redirects@<1.16.1': '>=1.16.1'
  # GHSA-6qxp-vccf-f47h / -22jm-h49p-29qw / -46jr-4wx8-v453. Parent: @angular/cli.
  '@modelcontextprotocol/sdk@<1.32.0': '>=1.32.0 <2.0.0'
  # GHSA-crvj-82cr-hjcx / -g6gw-c38x-mqfc / -gqvv-2mrq-wpjv / -frvp-7c67-39w9 /
  # -5r4p-p66f-jhc7. Parent: @angular/cli > @modelcontextprotocol/sdk.
  'hono@<4.13.11': '>=4.13.11 <5.0.0'
  '@hono/node-server@<1.19.15': '>=1.19.15 <2.0.0'
  # GHSA-f65p-4m7j-42xc / -fph4-wmhf-6fwf / -jqff-g426-hqxp (host confusion),
  # GHSA-qw65-cvwx-89v3 / -58mr-gqgx-xq4g / -hrr3-gc8f-f4qj.
  # Pulled in by ajv via @nestjs/cli > @angular-devkit/core. 3.1.9 fixes the
  # remaining low and moderate advisories but sits inside the quarantine.
  'fast-uri@<3.1.8': '>=3.1.8 <4.0.0'
  # GHSA-r28c-9q8g-f849. Parents: sanitize-html, beasties (@angular/build).
  'postcss@<8.5.18': '>=8.5.18 <9.0.0'
  '@babel/plugin-transform-modules-systemjs@<7.29.4': '>=7.29.4'
  'uuid@>=11.0.0 <11.1.1': '>=11.1.1'
  # The entries below are transitive deps pinned to vulnerable versions by the
  # Angular build toolchain (@angular/build, webpack-dev-server) and other
  # parents. The parents have no released version that resolves them above the
  # CVE range — even @angular/build@21.2.16 still pins vite 7.3.2 / esbuild
  # 0.27.3 / piscina 5.1.4 / @babel/core 7.29.0 — so an override is the only fix.
  # Values are upper-bounded to the current major to avoid an unintended
  # major-version jump (e.g. @babel/core -> 8) when newer releases age out.
  # GHSA-395f-4hp3-45gv and GHSA-pqg4-j6r4-53mv (critical). Parents: concurrently,
  # webpack-dev-server > launch-editor.
  'shell-quote@<1.11.0': '>=1.11.0 <2.0.0'
  # GHSA-4mjr-xmp4-gh2g / -x5fp-wj9c-mxmx. Parent: supertest > superagent.
  'qs@>=6.11.1 <6.16.0': '>=6.16.0 <7.0.0'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1 <0.29.0'
  # GHSA-23hp-3jrh-7fpw (critical) + GHSA-r292-9mhp-454m. Parent: @angular/cli > pacote.
  'tar@>=7.0.0 <7.5.21': '>=7.5.21 <8.0.0'
  # GHSA-698v-4r3x-3vcv / -r825-w8mm-5pxw / -587h-7wmj-h5pm. Parent: webpack-dev-server.
  'launch-editor@<2.14.2': '>=2.14.2 <3.0.0'
  # GHSA-vc2v-76pw-4v95. Parent: webpack-dev-server.
  'compression@<1.8.2': '>=1.8.2 <2.0.0'
  # GHSA-jqcg-44mw-7w3h (critical). Parent: @nestjs/platform-express > express.
  'proxy-addr@<2.0.8': '>=2.0.8 <3.0.0'
  # GHSA-xw65-4hp5-5hc7 / -8r5x-fm3f-whwj / -p8wg-vrv2-v86f (critical). Parent: ts-jest.
  'handlebars@<4.7.10': '>=4.7.10 <5.0.0'
  # GHSA-68fv-2mgg-jv7q. Parent: postcss.
  'source-map-js@<1.2.2': '>=1.2.2 <2.0.0'
  # GHSA-mrhx-c7xc-m3w5. Parent: @ai-sdk/openai.
  'zod@>=4.0.0 <4.6.6': '>=4.6.6 <5.0.0'
  # GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj hit both live majors, so there is one
  # selector each. The 3.x entry must stay inside 3.x: @istanbuljs/load-nyc-config
  # relies on the v3-only safeLoad API and breaks if forced up to v4.
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1 <5.0.0'
  'js-yaml@>=3.0.0 <3.15.1': '>=3.15.1 <4.0.0'
  '@babel/core@>=7.0.0 <7.29.6': '>=7.29.6 <8.0.0'
  # GHSA-67c8-pqhq-4rmx (critical) raised the floor from 5.1.5 to 5.3.2.
  'piscina@>=5.0.0-alpha.0 <5.3.2': '>=5.3.2 <6.0.0'
  'vite@>=7.0.0 <7.3.7': '>=7.3.7 <8.0.0'
  # GHSA-cg2g-xh64-v4q7 (critical), GHSA-p98j-92pf-mc4p and earlier. Parent: jspdf.
  'dompurify@>=3.0.0 <3.4.17': '>=3.4.17 <4.0.0'
  # GHSA-xv26-6w52-cph6 (critical, DoS). Parent: webpack-dev-server > sockjs.
  'websocket-driver@<0.7.5': '>=0.7.5 <0.8.0'
  # GHSA-rgw5-rvv9-x895 / -mh99-v99m-4gvg / -3jxr-9vmj-r5cp (ReDoS). Reached through
  # minimatch from three different majors of brace-expansion, so one selector per major.
  # GHSA-qhr7-859c-m2p7 / -6j4f-fj2g-mc7p / -q2hr-2g5m-vwhr raised the floors.
  'brace-expansion@<1.1.21': '>=1.1.21 <2.0.0'
  'brace-expansion@>=2.0.0 <2.1.7': '>=2.1.7 <3.0.0'
  'brace-expansion@>=3.0.0 <5.0.12': '>=5.0.12 <6.0.0'
  # GHSA-c83g-rgw3-j3cx / -73wf-gq98-2v4g. Parent: @nestjs/cli > webpack.
  'browserslist@<=4.28.6': '>=4.28.7 <5.0.0'
  # GHSA-xvcm-6775-5m9r / -v56q-mh7h-f735 (hash-collision DoS). Parent: sass.
  'immutable@>=5.0.0-beta.1 <5.1.8': '>=5.1.8 <6.0.0'
  # GHSA-mwp4-54f8-5fhr. Parent: @angular/cli > @modelcontextprotocol/sdk > express-rate-limit.
  # GHSA-j6r3-76f7-8jcv / -h3mg-xc3c-68pw / -rxp7-6hxx-x8q5 raised the floor.
  'ip-address@<10.7.4': '>=10.7.4 <11.0.0'
  # GHSA-2v37-7h3g-55p8 / -28wg-ghj8-5hjv. Parent: sanitize-html > postcss.
  'nanoid@<3.3.18': '>=3.3.18 <4.0.0'
  # GHSA-w4pp-8pjf-rmxw and GHSA-52v5-jr5w-gjxr. Parent: @angular/cli.
  'pacote@>=11.2.7 <21.5.1': '>=21.5.1 <22.0.0'
  'sigstore@<=4.1.0': '>=4.1.1 <5.0.0'
  # GHSA-4cwx-7wf7-3272 / -vxpw-j846-p89q / -hm92-r4w5-c3mj / -vmh5-mc38-953g.
  # GHSA-rfgv-xxqx-mfg5 / -w293-vg96-wgc3 / -xjj6-f33q-929c / -4qv8-2p9j-2685 raised the floors.
  # Two majors are in the tree: @angular/build pins 7.x, @ai-sdk/provider-utils 6.x.
  'undici@<6.29.1': '>=6.29.1 <7.0.0'
  'undici@>=7.0.0 <7.30.1': '>=7.30.1 <8.0.0'
  # GHSA-hmw2-7cc7-3qxx. Parent: @types/supertest > @types/superagent.
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6 <5.0.0'
  # GHSA-64mm-vxmg-q3vj / GHSA-v422-hmwv-36x6. Parents: webpack-dev-server, which
  # holds express 4 (body-parser 1.x), and @nestjs/platform-express (body-parser 2.x).
  'http-proxy-middleware@>=0.16.0 <2.0.10': '>=2.0.10 <3.0.0'
  'body-parser@<1.20.6': '>=1.20.6 <2.0.0'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0 <3.0.0'
  # GHSA-4vj7-5mj6-jm8m / -jxfw-x594-9x9m. Parent: @compodoc/compodoc > @compodoc/live-server.
  'morgan@<1.12.0': '>=1.12.0 <2.0.0'
  # GHSA-w9m9-85wc-3x92. Parent: css-loader > postcss-modules-local-by-default.
  'postcss-selector-parser@>=7.1.0 <7.1.3': '>=7.1.3 <8.0.0'
