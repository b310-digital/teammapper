# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string
    secrets:
      IONOS_API_KEY:
        required: true

permissions:
  contents: read

env:
  DEPLOYMENT_FOLDER: ./teammapper-frontend/dist-offline/browser

jobs:
# Please do not rename this job
  build-project:
    name: build teammapper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Installs dependencies and builds the workspace packages.
      - uses: ./.github/actions/setup-pnpm

      # The legal link targets come from the repository variables IMPRINT_URL
      # and PRIVACY_URL. An unset variable hides its link.
      - name: Build the offline site
        env:
          CI: true
          IMPRINT_URL: ${{ vars.IMPRINT_URL }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
        run: pnpm --filter teammapper-frontend run build:offline-site

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@184a369b679287c06ff3d4392cf57bf0fd32656e # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: daa18f9f-c075-4470-b882-0acd3bd1d5a3
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/teammapper/config.yaml
          action: upload
