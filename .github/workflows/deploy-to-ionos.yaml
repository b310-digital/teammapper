# version: 2022-07-21

name: "Deploy Now: Deploy to IONOS"

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      project-id:
        required: true
        type: string
      branch-id:
        required: true
        type: string
      deployment-ids:
        required: true
        type: string
  push:
    paths:
      - .github/workflows/deploy-to-ionos.yaml

permissions:
  contents: read

concurrency: ${{ github.ref }}

jobs:
  deploy-to-ionos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    strategy:
      matrix:
        deployment-id: ${{ fromJson(inputs.deployment-ids) }}
    steps:
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@184a369b679287c06ff3d4392cf57bf0fd32656e # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          version: ${{ inputs.version }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@f90800cda6ff05947f58f27d6f9178c7bbd5180e # v2
        id: template
        with:
          deployment-id: ${{ matrix.deployment-id }}
          # The site ships no templates that read secrets, so the renderer gets none.
          data: "[${{ steps.deployment.outputs.template-variables }}]"
          input-directory: deployment
          output-directory: deployment
          intermediate-data-file: deployment/.template-renderer-data

      # Expressions reach the shell through env, so their values never become script text.
      - name: Render real site-url to all files
        env:
          SITE_URL: ${{ fromJson(steps.deployment.outputs.info).site-url }}
        run: |
          grep -rlZ 'https://IONOS_DEPLOY_NOW_SITE_URL' . | xargs -0 -r sed -i -e "s|https://IONOS_DEPLOY_NOW_SITE_URL|${SITE_URL}|g"

      - name: Render SSH user secret name
        env:
          DEPLOYMENT_ID: ${{ matrix.deployment-id }}
        run: |
          if [[ ! "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F-]+$ ]]; then
            echo "Deployment ID is not a UUID: $DEPLOYMENT_ID" >&2
            exit 1
          fi
          suffix=$(echo "$DEPLOYMENT_ID" | tr '[:lower:]-' '[:upper:]_')
          echo "SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_${suffix}_SSH_USERNAME" >> "$GITHUB_ENV"

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@452884710a8fec9421c32d6c8ab2c69566703b02 # v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  notify-deployment-finished:
    needs: deploy-to-ionos
    if: ${{ github.event_name == 'workflow_dispatch' && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@95e8bc58cdc22a86df7709493de6054179881470 # v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-eu.ionos.space
          project-id: ${{ inputs.project-id }}
          branch-id: ${{ inputs.branch-id }}
          action: set-deployments-finished
