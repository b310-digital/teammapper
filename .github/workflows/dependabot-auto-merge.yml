name: Dependabot Auto-merge

# Auto-squash-merge Dependabot PRs for low-risk npm updates after CI is green
# and the 7-day cooldown (configured in .github/dependabot.yml) has elapsed.
# Scope: npm minor + patch only (any dep-type). All majors, all docker bumps,
# and all github-actions updates require manual review.
# See docs/pnpm-security.md for the rationale.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-squash-merge for npm minor + patch
        if: |
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
